services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-usuario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha123}
      POSTGRES_DB: sistema_vendas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sistema_vendas
      DB_USER: ${DB_USER:-usuario}
      DB_PASSWORD: ${DB_PASSWORD:-senha123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PADRAO_EMAIL: ${PADRAO_EMAIL:-}
      PADRAO_PASSWORD: ${PADRAO_PASSWORD:-}
volumes:
  postgres_data:
