<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Listagem de Clientes</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid">
<a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
<div class="d-flex flex-wrap gap-3 align-items-center">
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/produto}">Produtos</a>
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/cliente}">Clientes</a>
<a class="text-white text-decoration-none" sec:authorize="isAuthenticated()" th:href="@{/pedido}">Pedidos</a>
<a class="text-white text-decoration-none" th:href="@{/logout}">Sair</a>
</div></div></nav>


<div class="container mt-4">

    <h1>Clientes</h1>

    <a class="btn btn-primary mb-3"
       th:href="@{/cliente/novo}">
        Novo Cliente
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="cliente : ${clientes}">

            <td th:text="${cliente.nome}"></td>

            <td th:text="${cliente.email}"></td>

            <td th:text="${cliente.telefone}"></td>

            <td>

                <a class="btn btn-sm btn-warning"
                   th:href="@{/cliente/edit/{id}(id=${cliente.id})}">
                    Editar
                </a>

                <a class="btn btn-sm btn-danger"
                   th:href="@{/cliente/delete/{id}(id=${cliente.id})}">
                    Excluir
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
