<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Sistema de Vendas</title><link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:460px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Sistema de Vendas</h1><div th:if="${param.error}" class="alert alert-danger">E-mail ou senha incorretos.</div><div th:if="${param.logout}" class="alert alert-success">Você saiu com segurança.</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label for="username" class="form-label">E-mail</label><input class="form-control" id="username" name="username" type="email" autocomplete="username" required autofocus></div><div class="mb-3"><label for="password" class="form-label">Senha</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Entrar</button></form></div></div></main></body></html>
