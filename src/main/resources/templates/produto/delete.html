<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Excluir Produto</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid">
<a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
<div class="d-flex flex-wrap gap-3 align-items-center">
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/produto}">Produtos</a>
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/cliente}">Clientes</a>
<a class="text-white text-decoration-none" sec:authorize="isAuthenticated()" th:href="@{/pedido}">Pedidos</a>
<a class="text-white text-decoration-none" th:href="@{/logout}">Sair</a>
</div></div></nav>

<div class="container mt-4">
    <h1>Excluir Produto</h1>

    <div class="alert alert-danger">
        <p>
            Tem certeza que deseja excluir o produto
            <strong th:text="${produto.nome}"></strong>?
        </p>
    </div>

    <table class="table table-bordered">
        <tr>
            <th>Nome</th>
            <td th:text="${produto.nome}"></td>
        </tr>
        <tr>
            <th>Descrição</th>
            <td th:text="${produto.descricao}"></td>
        </tr>
        <tr>
            <th>Preço</th>
            <td th:text="${produto.preco}"></td>
        </tr>
        <tr>
            <th>Quantidade em Estoque</th>
            <td th:text="${produto.quantidadeEmEstoque}"></td>
        </tr>
    </table>

    <form th:action="@{/produto/delete/{id}(id=${produto.id})}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a th:href="@{/produto}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
