<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">

    <title th:unless="${produto.id == null}">Edição de Produto</title>
    <title th:if="${produto.id == null}">Cadastro de Produto</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container-fluid">
<a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
<div class="d-flex flex-wrap gap-3 align-items-center">
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/produto}">Produtos</a>
<a class="text-white text-decoration-none" sec:authorize="hasRole('ADMIN')" th:href="@{/cliente}">Clientes</a>
<a class="text-white text-decoration-none" sec:authorize="isAuthenticated()" th:href="@{/pedido}">Pedidos</a>
<a class="text-white text-decoration-none" th:href="@{/logout}">Sair</a>
</div></div></nav>


<div class="container mt-5">

    <h2 th:text="${produto.id == null} ? 'Novo Produto' : 'Editar Produto'"></h2>

    <form
        th:action="${produto.id == null} 
            ? @{/produto/novo} 
            : @{/produto/edit/{id}(id=${produto.id})}"
        th:object="${produto}"
        method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>

            <input
                type="text"
                class="form-control"
                id="nome"
                th:field="*{nome}">

            <div
                class="text-danger"
                th:if="${#fields.hasErrors('nome')}"
                th:errors="*{nome}">
            </div>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>

            <input
                type="text"
                class="form-control"
                id="descricao"
                th:field="*{descricao}">

            <div
                class="text-danger"
                th:if="${#fields.hasErrors('descricao')}"
                th:errors="*{descricao}">
            </div>
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>

            <input
                type="number"
                step="0.01"
                class="form-control"
                id="preco"
                th:field="*{preco}">

            <div
                class="text-danger"
                th:if="${#fields.hasErrors('preco')}"
                th:errors="*{preco}">
            </div>
        </div>

        <div class="mb-3">
            <label for="quantidadeEmEstoque" class="form-label">
                Quantidade em Estoque
            </label>

            <input
                type="number"
                class="form-control"
                id="quantidadeEmEstoque"
                th:field="*{quantidadeEmEstoque}">

            <div
                class="text-danger"
                th:if="${#fields.hasErrors('quantidadeEmEstoque')}"
                th:errors="*{quantidadeEmEstoque}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a th:href="@{/produto}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
